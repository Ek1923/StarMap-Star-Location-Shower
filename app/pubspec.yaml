name: starmap
description: "See which stars are above you right now."
publish_to: 'none'

# Bumped by hand. There is no CI to do it, and a version that moves on its own is a version
# nobody can point at.
version: 1.2.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Two runtime dependencies, each with one job.
  #
  # The whole app is "what is above YOU", which needs a latitude and a longitude.
  geolocator: ^13.0.2
  #
  # And one HTTP client, for the single service this app talks to: NASA/JPL Horizons, which
  # sharpens the positions when there is a connection. `package:http` rather than dart:io because
  # dart:io does not exist on the web. The app is fully usable with this never succeeding - see
  # lib/net/horizons.dart.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Built by `py -3.12 data/build_catalogue.py`. 9,096 stars, the 88 constellations and the IAU
    # boundary table. Not committed - it is reproducible from data/raw.
    - assets/stars.json
    # Planet and Sun maps for the 3D view. Solar System Scope (INOVE), CC BY 4.0 - see
    # assets/planets/README.md for the attribution the licence requires.
    - assets/planets/

  fonts:
    # Spectral, by Production Type. SIL Open Font License 1.1 - see assets/fonts/README.md.
    # Bundled rather than fetched at runtime: this app has to work in a dark field with no signal,
    # and a font that arrives over the network is a font that sometimes does not.
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Light.ttf
          weight: 300
        - asset: assets/fonts/Spectral-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600

  # GLSL fragment shaders. Verified to compile for web and Android in this Flutter version
  # before the 3D view was designed around them - the compiled artefact lands in
  # build/web/assets/shaders/, which is the proof rather than the documentation's word.
  shaders:
    - shaders/planet.frag
